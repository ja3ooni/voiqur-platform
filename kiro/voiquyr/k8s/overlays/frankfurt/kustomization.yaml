apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: voiquyr
resources:
  - ../base
  - externaldns-deployment.yaml
patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
  - path: namespace-patch.yaml
    target:
      kind: Namespace
      name: voiquyr
helmCharts:
  - name: euvoice-platform
    releaseName: euvoice
    namespace: voiquyr
    path: ../../helm/euvoice-platform
    valuesFile: values-frankfurt.yaml
